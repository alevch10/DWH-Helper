[tool.poetry]
name = "dwh-helper"
version = "2.0.0"
description = "DWH Helper - product analytics data helper"
authors = ["Andrey Levchenko <aa.levchenko@severmed.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
fastapi = "^0.101.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.0.0"
uvicorn = "^0.23.2"
httpx = "^0.24.0"
python-dotenv = "^1.0.0"
boto3 = "^1.34.0"
python-multipart = "^0.0.22"
pyjwt = "^2.11.0"
pyyaml = "^6.0.3"
psycopg2 = "^2.9.11"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.4.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
